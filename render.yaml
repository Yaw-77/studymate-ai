databases:
  - name: studymate-db
    databaseName: studymate
    user: studymate

services:
  - type: web
    name: studymate-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studymate-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_DAYS
        value: "7"
      # CORS: This is a placeholder. You will need to update this to your actual frontend URL in the dashboard if Render adds a suffix to your frontend name.
      - key: FRONTEND_URL
        value: "https://studymate-frontend.onrender.com"

  - type: web
    name: studymate-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # We leave VITE_API_BASE_URL blank in the blueprint because Render does not 
      # support dynamically injecting another service's full HTTPS URL during build. 
      # You will be prompted to enter this in the dashboard during the first setup!
      - key: VITE_API_BASE_URL
        sync: false
